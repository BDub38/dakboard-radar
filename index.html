<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #1a1a2e;
  }

  #map {
    width: 100vw;
    height: 100vh;
  }

  .leaflet-control-container {
    display: none !important;
  }

  .leaflet-attribution-flag {
    display: none !important;
  }
</style>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
<div id="map"></div>

<script>
  const map = L.map('map', {
    zoomControl: false,
    attributionControl: false,
    dragging: false,
    scrollWheelZoom: false,
    doubleClickZoom: false
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd',
    crossOrigin: true
  }).addTo(map);

  map.fitBounds([
    [36.6, -96.5],
    [43.9, -86.0]
  ]);

  let radarLayers = [];
  let currentFrame = 0;
  let animTimer = null;

  async function loadRadar() {
    try {
      const res = await fetch('https://api.rainviewer.com/public/weather-maps.json', {
        mode: 'cors',
        cache: 'no-store'
      });
      const data = await res.json();
      const frames = data.radar.past.slice(-10);

      // Pre-create all tile layers (hidden)
      radarLayers.forEach(l => map.removeLayer(l));
      radarLayers = frames.map(frame =>
        L.tileLayer(
          `https://tilecache.rainviewer.com/v2/radar/${frame.time}/512/{z}/{x}/{y}/6/1_1.png`,
          {
            opacity: 0,
            tileSize: 512,
            zoomOffset: -1,
            crossOrigin: true
          }
        )
      );

      radarLayers.forEach(l => l.addTo(map));

      // Show first frame
      currentFrame = 0;
      animate();

    } catch(e) {
      console.error('Radar load error:', e);
    }
  }

  function animate() {
    if (animTimer) clearInterval(animTimer);

    animTimer = setInterval(() => {
      // Hide previous
      radarLayers.forEach((l, idx) => {
        l.setOpacity(idx === currentFrame ? 0.85 : 0);
      });

      currentFrame = (currentFrame + 1) % radarLayers.length;
    }, 700);
  }

  // Load on start, refresh every 10 min
  loadRadar();
  setInterval(loadRadar, 10 * 60 * 1000);
</script>
</body>
</html>
