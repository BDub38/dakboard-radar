<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: transparent;
}

#map {
  width: 100vw;
  height: 100vh;
}

/* Clean look */
.leaflet-control-container {
  display: none;
}
</style>
</head>

<body>
<div id="map"></div>

<script>
const map = L.map('map', {
  zoomControl: false,
  attributionControl: false,
  dragging: false
});

// Better contrast map
L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',
  { subdomains: 'abcd' }
).addTo(map);

// Illinois + west view
map.fitBounds([
  [36.6, -96.5],
  [43.9, -86.0]
]);

let radarLayer = null;
let frames = [];
let i = 0;

async function load() {
  const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
  const data = await res.json();

  frames = data.radar.past.slice(-12).map(f => f.time);

  animate();
}

function show(frame) {
  if (radarLayer) map.removeLayer(radarLayer);

  radarLayer = L.tileLayer(
    `https://tilecache.rainviewer.com/v2/radar/${frame}/256/{z}/{x}/{y}/6/1_1.png`,
    { opacity: 0.85 }
  );

  radarLayer.addTo(map);
}

function animate() {
  setInterval(() => {
    if (!frames.length) return;
    show(frames[i]);
    i = (i + 1) % frames.length;
  }, 700);
}

load();
</script>
</body>
</html>
